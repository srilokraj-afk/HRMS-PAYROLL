spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/payroll_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Development security credentials (override with environment variables)
app.security.admin.username=${ADMIN_USERNAME:admin}
app.security.admin.password=${ADMIN_PASSWORD:admin123}
app.security.user.username=${USER_USERNAME:user}
app.security.user.password=${USER_PASSWORD:user123}

# JWT settings
app.jwt.secret=${JWT_SECRET:change-this-jwt-secret-to-a-long-random-value-32chars-min}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Employee demo account (link username to an employee email for /payroll/history/me)
app.security.employee.username=${EMPLOYEE_USERNAME:employee}
app.security.employee.password=${EMPLOYEE_PASSWORD:employee123}
